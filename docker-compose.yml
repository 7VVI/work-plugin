services:
  dock-cloud:
    build: .
    image: dock-cloud:latest
    restart: unless-stopped
    init: true
    ports:
      - "8080:8080"
    environment:
      DOCK_ADMIN_SECRET: ${DOCK_ADMIN_SECRET}
      DOCK_API_TOKEN: ${DOCK_API_TOKEN}
      DOCK_DATA_KEY: ${DOCK_DATA_KEY}
      DOCK_SESSION_DAYS: ${DOCK_SESSION_DAYS:-30}
      DOCK_HISTORY_LIMIT: ${DOCK_HISTORY_LIMIT:-100}
      DOCK_COOKIE_SECURE: ${DOCK_COOKIE_SECURE:-true}
      DOCK_PUBLIC_ORIGIN: ${DOCK_PUBLIC_ORIGIN:-}
      DOCK_TRUST_PROXY: ${DOCK_TRUST_PROXY:-true}
      DOCK_SSH_ENABLED: ${DOCK_SSH_ENABLED:-true}
      DOCK_SSH_MAX_SESSIONS: ${DOCK_SSH_MAX_SESSIONS:-8}
      DOCK_SSH_MAX_PER_SERVER: ${DOCK_SSH_MAX_PER_SERVER:-2}
      DOCK_SSH_IDLE_MS: ${DOCK_SSH_IDLE_MS:-1800000}
      DOCK_SSH_TICKET_TTL_MS: ${DOCK_SSH_TICKET_TTL_MS:-30000}
      DOCK_DB: /data/dock.sqlite
      DOCK_WEB_DIST: /app/public
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - dock-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  dock-data:
